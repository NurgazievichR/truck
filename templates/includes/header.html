{% load static %}
<!-- Desktop Header -->
<header class="hidden md:block sticky top-0 z-50 w-full bg-white/95 dark:bg-background-dark/95 backdrop-blur-sm border-b border-primary/10 shadow-sm">
<div class="w-full px-2">
<div class="flex h-20 items-center justify-between">
<!-- Logo -->
<a href="{% url 'main:index' %}" class="flex items-center gap-3">
<span class="text-2xl md:text-3xl font-extrabold tracking-wide uppercase text-primary dark:text-white" style="font-family: 'DM Sans', sans-serif; line-height: 1;">SAFETYLAB</span>
</a>
<!-- Navigation -->
<nav class="hidden md:flex items-center gap-8 absolute left-1/2 -translate-x-1/2">
<a class="text-base font-semibold text-[#555] dark:text-slate-300 hover:text-primary transition-colors" href="{% url 'main:index' %}" data-i18n="nav.home">Home</a>
<a class="text-base font-semibold text-[#555] dark:text-slate-300 hover:text-primary transition-colors" href="{% url 'main:index' %}#services" data-i18n="nav.services">Services</a>
<a class="text-base font-semibold text-[#555] dark:text-slate-300 hover:text-primary transition-colors" href="{% url 'main:about' %}" data-i18n="nav.aboutUs">About</a>
<a class="text-base font-semibold text-[#555] dark:text-slate-300 hover:text-primary transition-colors" href="{% url 'main:contacts' %}" data-i18n="nav.contactUs">Contact Us</a>
<a class="text-base font-semibold text-[#555] dark:text-slate-300 hover:text-primary transition-colors" href="mailto:info@safetylabinc.com">info@safetylabinc.com</a>
</nav>
<!-- Actions -->
<div class="flex items-center gap-4">
<div class="hidden lg:flex items-center gap-2">
<a href="tel:+13058508306" class="flex items-center justify-center rounded-lg h-10 px-4 bg-primary text-white text-sm font-bold hover:bg-secondary transition-all">
<span>+1 (305) 850-8306</span>
</a>
<div class="flex items-center justify-center rounded-lg h-10 px-3 bg-primary/10 text-primary dark:bg-primary/20 dark:text-white text-xs font-bold gap-2">
<button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
<span>/</span>
<button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
</div>
{% if tg_url %}
<a class="flex items-center justify-center rounded-lg h-10 w-10 bg-[#229ED9] text-white hover:opacity-90 transition-opacity" href="{{ tg_url }}" target="_blank" rel="noopener noreferrer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.32 14.868l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.828.691z"/>
</svg>
</a>
{% endif %}
</div>
</div>
</div>
</div>
</header>

<!-- Mobile Offcanvas Menu -->
<div id="mobile-menu" class="md:hidden fixed inset-0 bg-white dark:bg-background-dark z-[60] flex flex-col pt-20 px-6 transform translate-x-full transition-transform duration-300">
   <button id="mobile-menu-close" class="absolute top-6 right-6 material-symbols-outlined text-3xl text-primary dark:text-white">close</button>
   <nav class="flex flex-col gap-6 text-xl font-bold mt-4" style="font-family: 'DM Sans', sans-serif;">
        <a href="{% url 'main:index' %}" class="text-primary dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4" data-i18n="nav.home">Home</a>
        <a href="{% url 'main:index' %}#services" class="text-primary dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4" data-i18n="nav.services">Services</a>
        <a href="{% url 'main:about' %}" class="text-primary dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4" data-i18n="nav.aboutUs">About</a>
        <a href="{% url 'main:contacts' %}" class="text-primary dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4" data-i18n="nav.contactUs">Contact Us</a>
        <a href="mailto:info@safetylabinc.com" class="text-primary dark:text-white pb-4">info@safetylabinc.com</a>
   </nav>
</div>
<!-- Mobile Header -->
<header class="md:hidden sticky top-0 z-50 bg-white dark:bg-background-dark border-b border-primary/10 shadow-sm w-full">
<div class="flex items-center justify-between p-4 h-16">
<div class="flex items-center gap-3">
<button id="mobile-menu-btn" aria-label="Menu" class="material-symbols-outlined text-primary dark:text-white text-3xl">menu</button>
<a href="{% url 'main:index' %}" class="flex items-center gap-2">
    <span class="text-xl font-bold tracking-tight text-primary dark:text-white uppercase" style="font-family: 'DM Sans', sans-serif; line-height: 1;">SAFETYLAB</span>
</a>
</div>
<div class="flex items-center gap-3">
<a class="flex items-center justify-center w-8 h-8 rounded-full bg-accent/10 text-primary dark:text-accent" href="tel:+13058508306">
<span class="material-symbols-outlined text-[20px]">phone</span>
</a>
<div class="flex items-center justify-center rounded border border-primary/20 bg-transparent px-1.5 py-1 gap-1 text-[10px] font-bold text-primary dark:text-white" style="line-height:1;">
<button type="button" class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
<span>/</span>
<button type="button" class="lang-btn" data-lang="ru" aria-pressed="false">RU</button>
</div>
</div>
</div>
</header>
