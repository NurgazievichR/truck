<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Safety Lab — Compliance Management for Trucking{% endblock %}</title>
    {% block meta %}{% endblock %}
    <meta name="description" content="{% block meta_description %}Safety Lab helps trucking companies stay compliant with IFTA, IRP, UCR, and FMCSA. Trusted by 500+ fleets nationwide.{% endblock %}">
    <meta property="og:title" content="{% block og_title %}Safety Lab — Compliance Management for Trucking{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Stay audit-ready. Reduce risk. Trusted compliance management for trucking companies.{% endblock %}">
    <meta property="og:type" content="website">
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Allura&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#253d38",
                        "secondary": "#314d47",
                        "accent": "#398573",
                        "background-light": "#f6f7f8",
                        "background-dark": "#13181f",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6">
    <link rel="stylesheet" href="{% static 'css/chatbot.css' %}?v=1">
    {% block extra_head %}{% endblock %}
</head>
<body class="font-display bg-background-light dark:bg-background-dark text-[#333] dark:text-slate-100 {% block body_class %}{% endblock %}" data-static-url="{% static '' %}" data-tg-handle="{{ tg_handle }}">
    {% include 'includes/header.html' %}

    <main id="main-content" role="main">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}

    <script src="{% static 'js/i18n.js' %}?v=4"></script>
    <script src="{% static 'js/main.js' %}?v=4"></script>
    <script src="{% static 'js/chatbot.js' %}?v=1"></script>

    {# Tawk.to temporarily disabled #}
</body>
</html>
